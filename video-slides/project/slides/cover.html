<h1 style="font-size:88px;font-weight:900;line-height:1.2">オリジナルウッドデッキ<br>日曜大工プログラム</h1>
<p style="font-size:32px;line-height:1.6;color:#4a564d">日曜日を使って、あなたの家にぴったりのウッドデッキを、自分の手で。</p>
<p style="font-size:28px;color:#4a564d">監修：野村 隆一（どけん屋なボク）</p>
<aside>こんにちは。オリジナルウッドデッキ 日曜大工プログラム、監修の野村隆一です。この解説動画では、マニュアルの6つのステップに沿って、ウッドデッキづくりの要点を順番にお話しします。右の写真は、私がつくったウッドデッキです。建設の仕事を35年やってきましたが、デッキづくりで一番大事なのは「計測と基礎」。そこを中心にお伝えしていきます。</aside>
