<h1 style="font-size:120px;font-weight:900;line-height:1.15">丁張り入門</h1>
<p style="font-size:36px;line-height:1.6;color:#d7ddd8;width:1400px">建設の現場が工事の最初に必ずやる「基準づくり」。位置と高さの基準をつくれば、束石は迷わずそろいます。</p>
<p style="font-size:28px;color:#d7ddd8">監修：野村 隆一（どけん屋なボク）　建設関係の仕事35年</p>
<aside>こんにちは、野村隆一です。今日は、丁張りについてお話しします。丁張りは、遣り方とも呼ばれます。建設の現場では、工事の最初に必ずかける、位置と高さの基準です。ウッドデッキの出来は基礎で決まり、基礎の出来は、この基準で決まります。少し手間はかかりますが、丁張りをかけておけば、束石の位置も高さも、迷わずにそろえられます。プロの段取りを、家庭のデッキ向けに、やさしくお伝えします。</aside>
