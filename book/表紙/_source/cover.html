<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
html,body{margin:0;padding:0}
.c{width:1600px;height:2560px;position:relative;overflow:hidden;box-sizing:border-box}
.c *{box-sizing:border-box}
.abs{position:absolute}

/* ===== A: やわらかエレガント ===== */
.A{background:linear-gradient(170deg,#fbf3ee 0%,#f6e3e0 55%,#efd3d3 100%);font-family:"Noto Serif JP",serif;color:#5b2f3c}
.A .frame{left:70px;top:70px;right:70px;bottom:70px;border:3px solid #c9a27a;border-radius:10px}
.A .frame2{left:92px;top:92px;right:92px;bottom:92px;border:1px solid #c9a27a;border-radius:6px}
.A .lead{top:300px;left:0;right:0;text-align:center;font-size:66px;letter-spacing:.12em;color:#8c4a5e;font-weight:500}
.A .lead span{display:inline-block;border-top:2px solid #c9a27a;border-bottom:2px solid #c9a27a;padding:18px 40px}
.A .title{top:500px;left:0;right:0;text-align:center;font-weight:900;font-size:178px;line-height:1.32;letter-spacing:.02em}
.A .title em{font-style:normal;color:#b0466a;font-size:216px}
.A .sub{top:1400px;left:0;right:0;text-align:center;font-size:60px;line-height:1.7;font-weight:500;color:#6e4652}
.A .illu{left:0;right:0;top:1610px;text-align:center}
.A .author{bottom:230px;left:0;right:0;text-align:center;font-size:84px;font-weight:700;letter-spacing:.2em}

/* ===== B: ナチュラル ===== */
.B{background:#fbfaf6;font-family:"Zen Maru Gothic",sans-serif;color:#2f4a40}
.B .band{left:0;right:0;top:0;height:1180px;background:#cfdcd2}
.B .wave{left:0;top:1080px}
.B .lead{top:230px;left:120px;font-size:64px;font-weight:700;color:#3d6656;letter-spacing:.06em}
.B .lead::after{content:"";display:block;width:140px;height:8px;background:#e7a98f;border-radius:4px;margin-top:30px}
.B .title{top:420px;left:120px;right:100px;font-weight:700;font-size:172px;line-height:1.3}
.B .title em{font-style:normal;background:linear-gradient(transparent 62%,#f3c7b3 62%);padding:0 6px}
.B .sub{top:1330px;left:120px;right:120px;font-size:64px;line-height:1.65;font-weight:500;color:#4d6a5f}
.B .illu{left:0;right:0;top:1640px;text-align:center}
.B .author{bottom:200px;left:120px;right:120px;font-size:84px;font-weight:700;letter-spacing:.14em;border-top:4px solid #2f4a40;padding-top:56px;text-align:right}

/* ===== C: インパクト ===== */
.C{background:#2d2140;font-family:"Zen Kaku Gothic New",sans-serif;color:#fff}
.C .glow{left:-300px;top:-300px;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,#7a3f6d 0%,rgba(45,33,64,0) 70%)}
.C .glow2{right:-400px;bottom:200px;width:1300px;height:1300px;border-radius:50%;background:radial-gradient(circle,#5a3a7a 0%,rgba(45,33,64,0) 70%)}
.C .lead{top:240px;left:120px;font-size:62px;font-weight:700;background:#f08a7e;color:#2d2140;padding:16px 40px;border-radius:60px}
.C .title{top:470px;left:120px;right:80px;font-weight:900;font-size:186px;line-height:1.24}
.C .title em{font-style:normal;color:#ffb3a7;font-size:236px}
.C .sub{top:1300px;left:120px;right:120px;font-size:62px;line-height:1.7;font-weight:500;color:#e6dcef}
.C .illu{right:90px;top:1720px}

.C .bar{bottom:150px;left:120px;width:300px;height:10px;background:#f08a7e;border-radius:5px}
