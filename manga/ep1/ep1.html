<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700;900&family=Mochiy+Pop+One&display=block" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#fff;overflow:hidden}svg{display:block}</style>
</head><body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const W=1080,H=1920;
const F={body:"'Zen Maru Gothic',sans-serif",sfx:"'Dela Gothic One',sans-serif",pop:"'Mochiy Pop One',sans-serif"};
const C={line:'#4a2a22',skin:'#feeddb',hair:'#d9944f',hairD:'#b06a2e',eye:'#8b5a2b',vest:'#48403e',pants:'#13304a',shoe:'#a7abaf',
  work:'#8fa9be',workD:'#6d8aa2',glove:'#ffffff',green:'#2e9e4f',red:'#e03131',yellow:'#ffd43b',ink:'#151515'};

// ---------- utils ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-clamp(k),3);
const eback=k=>{k=clamp(k);const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const pop=(t,t0,d=0.35)=>t<t0?0:eback((t-t0)/d);
const fade=(t,t0,d=0.4)=>clamp((t-t0)/d);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let UID=0;const uid=()=>'u'+(UID++);

function T(x,y,str,o={}){
  const size=o.size||48,lh=o.lh||size*1.32,lines=String(str).split('\n');
  const y0=y-(lines.length-1)*lh/2;
  const st=o.stroke?`stroke="${o.stroke}" stroke-width="${o.sw||8}" stroke-linejoin="round" paint-order="stroke"`:'';
  return `<text x="${x}" y="${y0}" font-family="${o.font||F.body}" font-size="${size}" font-weight="${o.weight||900}" fill="${o.fill||C.ink}" text-anchor="${o.anchor||'middle'}" dominant-baseline="central" ${st} ${o.ls?`letter-spacing="${o.ls}"`:''} ${o.attr||''}>${lines.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join('')}</text>`;
}
const G=(inner,tr='',extra='')=>`<g ${tr?`transform="${tr}"`:''} ${extra}>${inner}</g>`;
const scaleAt=(x,y,k)=>`translate(${x},${y}) scale(${k}) translate(${-x},${-y})`;

// ---------- bubbles ----------
function bubble(o){
  const k=o.k!==undefined?o.k:pop(o.t,o.t0);if(k<=0)return '';
  const {x,y,w,h}=o,rx=w/2,ry=h/2,type=o.type||'speech';let s='';
  const tail=(sw)=>{if(!o.tail)return '';const [tx,ty]=o.tail;const a=Math.atan2((ty-y)/ry,(tx-x)/rx);
    const p=(aa,f)=>[x+rx*f*Math.cos(aa),y+ry*f*Math.sin(aa)];const b1=p(a-0.2,0.9),b2=p(a+0.2,0.9);
    return `<path d="M${b1} Q${(b1[0]+tx)/2+8},${(b1[1]+ty)/2} ${tx},${ty} Q${(b2[0]+tx)/2-8},${(b2[1]+ty)/2} ${b2}" fill="#fff" stroke="${C.ink}" stroke-width="${sw}" stroke-linejoin="round"/>`;};
  if(type==='speech'){
    s+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" stroke="${C.ink}" stroke-width="6"/>`+tail(6);
  }else if(type==='thought'){
    const n=Math.round((w+h)/42),r=Math.min(w,h)*0.14;let a1='',a2='';
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2,cx=x+rx*0.93*Math.cos(a),cy=y+ry*0.93*Math.sin(a);
      a1+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${C.ink}" stroke-width="5"/>`;a2+=`<circle cx="${cx}" cy="${cy}" r="${r-3}" fill="#fff"/>`;}
    s+=a1+a2+`<ellipse cx="${x}" cy="${y}" rx="${rx*0.95}" ry="${ry*0.95}" fill="#fff"/>`;
    if(o.tail){const [tx,ty]=o.tail;for(let i=0;i<3;i++){const f=0.55+i*0.22;const cx=lerp(x+(tx-x)*0.55,tx,i/2.2),cy=lerp(y+(ty-y)*0.55,ty,i/2.2);
      s+=`<circle cx="${cx}" cy="${cy}" r="${(3-i)*9}" fill="#fff" stroke="${C.ink}" stroke-width="5"/>`;}}
  }else if(type==='shout'){
    const N=22,R=rng(o.seed||7);let pts=[];
    for(let i=0;i<N*2;i++){const a=i/(N*2)*Math.PI*2,f=i%2?1.22+R()*0.1:0.98;pts.push([x+rx*f*Math.cos(a),y+ry*f*Math.sin(a)]);}
    s+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#fff" stroke="${C.ink}" stroke-width="6" stroke-linejoin="miter"/>`;
  }else if(type==='box'){
    s+=`<rect x="${x-rx+8}" y="${y-ry+8}" width="${w}" height="${h}" fill="${C.ink}"/><rect x="${x-rx}" y="${y-ry}" width="${w}" height="${h}" fill="${o.fill||'#fff'}" stroke="${C.ink}" stroke-width="5"/>`;
  }
  s+=T(x,y+(o.dy||0),o.text,{size:o.size||46,fill:o.color||C.ink,font:o.font});
  return G(s,scaleAt(x,y,k));
}
function sfx(x,y,str,o={}){
  const k=o.k!==undefined?o.k:pop(o.t,o.t0,0.25);if(k<=0)return '';
  const sh=o.shake?Math.sin(o.t*60)*o.shake:0;
  return G(T(x,y,str,{size:o.size||110,font:F.sfx,fill:o.fill||'#fff',stroke:o.stroke||C.ink,sw:o.sw||16,weight:400,ls:o.ls}),`translate(${sh},0) ${scaleAt(x,y,k)} rotate(${o.rot||0},${x},${y})`);
}

// ---------- backgrounds ----------
function speedLines(cx,cy,seed,rIn=320,color=C.ink,n=110){
  const R=rng(seed);let s='';
  for(let i=0;i<n;i++){const a=R()*Math.PI*2,da=0.003+R()*0.011,r0=rIn*(0.75+R()*0.7),r1=2400;
    s+=`<polygon points="${cx+r0*Math.cos(a)},${cy+r0*Math.sin(a)} ${cx+r1*Math.cos(a-da)},${cy+r1*Math.sin(a-da)} ${cx+r1*Math.cos(a+da)},${cy+r1*Math.sin(a+da)}" fill="${color}"/>`;}
  return s;
}
function sunburst(cx,cy,t,c1,c2,n=28){
  let s=`<rect x="-100" y="-100" width="${W+200}" height="${H+200}" fill="${c1}"/>`;const rot=t*0.15;
  for(let i=0;i<n;i+=2){const a0=rot+i/n*Math.PI*2,a1=rot+(i+1)/n*Math.PI*2,r=2600;
    s+=`<polygon points="${cx},${cy} ${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)} ${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)}" fill="${c2}"/>`;}
  return s;
}
function siteBG(x,y,w,h,o={}){
  const hz=y+h*(o.horizon||0.56);let s='';
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${hz-y}" fill="url(#sky)"/>`;
  // clouds
  s+=`<g fill="#fff" opacity=".9"><ellipse cx="${x+w*0.2}" cy="${y+h*0.12}" rx="90" ry="34"/><ellipse cx="${x+w*0.27}" cy="${y+h*0.10}" rx="60" ry="40"/><ellipse cx="${x+w*0.75}" cy="${y+h*0.2}" rx="110" ry="30"/></g>`;
  // crane
  const cx=x+w*0.82,ct=y+h*0.06;
  s+=`<g stroke="#e8a33a" stroke-width="7" fill="none"><line x1="${cx}" y1="${hz}" x2="${cx}" y2="${ct}"/><line x1="${cx+28}" y1="${hz}" x2="${cx+28}" y2="${ct}"/>`;
  for(let yy=ct;yy<hz;yy+=40)s+=`<line x1="${cx}" y1="${yy}" x2="${cx+28}" y2="${yy+40}"/>`;
  s+=`<line x1="${cx-w*0.55}" y1="${ct}" x2="${cx+90}" y2="${ct}"/><line x1="${cx-w*0.55}" y1="${ct+22}" x2="${cx+28}" y2="${ct+22}"/><line x1="${cx+14}" y1="${ct-50}" x2="${cx-w*0.4}" y2="${ct}"/></g>`;
  s+=`<line x1="${cx-w*0.35}" y1="${ct+22}" x2="${cx-w*0.35}" y2="${ct+h*0.2}" stroke="#555" stroke-width="3"/><rect x="${cx-w*0.35-10}" y="${ct+h*0.2}" width="20" height="16" fill="#555"/>`;
  // building with scaffolding
  const bx=x+w*0.08,bw=w*0.42,bt=y+h*0.22;
  s+=`<rect x="${bx}" y="${bt}" width="${bw}" height="${hz-bt}" fill="#cfd6dc" stroke="#8a949c" stroke-width="3"/>`;
  s+=`<g stroke="#7d8790" stroke-width="3">`;for(let xx=bx;xx<=bx+bw+1;xx+=bw/6)s+=`<line x1="${xx}" y1="${bt}" x2="${xx}" y2="${hz}"/>`;
  for(let yy=bt;yy<hz;yy+=(hz-bt)/5)s+=`<line x1="${bx}" y1="${yy}" x2="${bx+bw}" y2="${yy}"/>`;s+=`</g>`;
  s+=`<rect x="${bx}" y="${bt}" width="${bw}" height="${hz-bt}" fill="#5aa86a" opacity=".25"/>`;
  // ground
  s+=`<rect x="${x}" y="${hz}" width="${w}" height="${y+h-hz}" fill="#ecdcb8"/>`;
  const R=rng(3);s+=`<g stroke="#cdb689" stroke-width="4" stroke-linecap="round">`;
  for(let i=0;i<26;i++){const gx=x+R()*w,gy=hz+20+R()*(y+h-hz-20);s+=`<line x1="${gx}" y1="${gy}" x2="${gx+20+R()*40}" y2="${gy}"/>`;}s+=`</g>`;
  // batter boards (丁張り)
  const tx=x+w*(o.tbx||0.06),ty=hz+60;
  s+=`<g stroke="${C.ink}" stroke-width="3"><rect x="${tx}" y="${ty-90}" width="14" height="120" fill="#d9b37a"/><rect x="${tx+200}" y="${ty-90}" width="14" height="120" fill="#d9b37a"/><rect x="${tx-10}" y="${ty-70}" width="240" height="22" fill="#fff"/></g><line x1="${tx-10}" y1="${ty-59}" x2="${tx+230}" y2="${ty-59}" stroke="${C.red}" stroke-width="3"/>`;
  // cones + bar
  const cone=(px,py)=>`<g stroke="${C.ink}" stroke-width="3"><polygon points="${px-30},${py} ${px+30},${py} ${px+10},${py-90} ${px-10},${py-90}" fill="#ff7a1a"/><polygon points="${px-20},${py-35} ${px+20},${py-35} ${px+15},${py-55} ${px-15},${py-55}" fill="#fff" stroke="none"/><rect x="${px-40}" y="${py-8}" width="80" height="12" fill="#ff7a1a"/></g>`;
  const k1=x+w*(o.c1||0.62),k2=x+w*(o.c2||0.93),cy2=hz+70;
  s+=cone(k1,cy2)+cone(k2,cy2);
  s+=`<rect x="${k1+10}" y="${cy2-80}" width="${k2-k1-20}" height="18" fill="url(#hz)" stroke="${C.ink}" stroke-width="3"/>`;
  return s;
}
function toneBG(x,y,w,h,col='#fff8e6'){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#tone)"/>`;}
function panel(x,y,w,h,inner,o={}){
  const id=uid();const k=o.t===undefined?1:eo((o.t-(o.t0||0))/0.35);if(k<=0)return '';
  const dx=(1-k)*(o.from==='left'?-80:80);
  return G(`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath><g clip-path="url(#${id})"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.bg||'#fff'}"/>${inner}</g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${C.ink}" stroke-width="7"/>`,`translate(${dx},0)`,`opacity="${k}"`);
}
function header(dark){
  return `<rect x="0" y="0" width="${W}" height="150" fill="#151515"/><rect x="0" y="146" width="${W}" height="18" fill="url(#hz)"/>`+
   T(W/2,58,'問題は現場で起きている',{size:54,font:F.sfx,fill:'#fff',weight:400})+T(W/2,112,'第1話「〇〇ってなんぞやぁ～」',{size:34,fill:C.yellow});
}

// ---------- props ----------
function kakeya(x,y,s,rot){
  return G(`<rect x="-10" y="40" width="20" height="330" rx="8" fill="#e2be86" stroke="${C.ink}" stroke-width="6"/>
   <rect x="-125" y="-55" width="250" height="110" rx="18" fill="#c9965a" stroke="${C.ink}" stroke-width="6"/>
   <path d="M-95,-30 Q-40,-38 20,-28 M-80,0 Q0,-8 70,2 M-60,28 Q10,20 90,30" stroke="#9a6c38" stroke-width="5" fill="none"/>
   <rect x="-125" y="-58" width="26" height="116" rx="6" fill="#8a8f96" stroke="${C.ink}" stroke-width="6"/>
   <rect x="99" y="-58" width="26" height="116" rx="6" fill="#8a8f96" stroke="${C.ink}" stroke-width="6"/>
   <rect x="-8" y="40" width="16" height="10" fill="#9a6c38"/>`,`translate(${x},${y}) rotate(${rot}) scale(${s})`);
}
function shovel(x,y,s){return G(`<rect x="-8" y="-170" width="16" height="200" fill="#d9b37a" stroke="${C.ink}" stroke-width="5"/><path d="M-30,-190 L30,-190 L30,-170 L-30,-170 Z" fill="#555" stroke="${C.ink}" stroke-width="5"/><path d="M-50,30 L50,30 L50,90 Q0,150 -50,90 Z" fill="#8c99a6" stroke="${C.ink}" stroke-width="6"/>`,`translate(${x},${y}) scale(${s})`);}
function crowbar(x,y,s){return G(`<path d="M0,-150 L0,90 Q0,140 -50,130" fill="none" stroke="${C.ink}" stroke-width="30" stroke-linecap="round"/><path d="M0,-150 L0,90 Q0,140 -50,130" fill="none" stroke="#d33" stroke-width="18" stroke-linecap="round"/><path d="M0,-150 L-14,-170" stroke="${C.ink}" stroke-width="20" stroke-linecap="round"/>`,`translate(${x},${y}) scale(${s})`);}
function barrow(x,y,s){return G(`<line x1="-60" y1="40" x2="-150" y2="70" stroke="${C.ink}" stroke-width="12" stroke-linecap="round"/><line x1="-30" y1="40" x2="-60" y2="100" stroke="${C.ink}" stroke-width="10"/><circle cx="85" cy="85" r="35" fill="#333" stroke="${C.ink}" stroke-width="6"/><circle cx="85" cy="85" r="12" fill="#bbb"/><path d="M-90,-30 L110,-30 L70,50 L-60,50 Z" fill="#3aa357" stroke="${C.ink}" stroke-width="6" stroke-linejoin="round"/><line x1="50" y1="50" x2="85" y2="85" stroke="${C.ink}" stroke-width="8"/>`,`translate(${x},${y}) scale(${s})`);}
function cat(x,y,s){return G(`<polygon points="-50,-30 -40,-80 -10,-45" fill="#f4b860" stroke="${C.ink}" stroke-width="5"/><polygon points="50,-30 40,-80 10,-45" fill="#f4b860" stroke="${C.ink}" stroke-width="5"/><ellipse cx="0" cy="0" rx="60" ry="50" fill="#f4b860" stroke="${C.ink}" stroke-width="5"/><circle cx="-20" cy="-5" r="6" fill="${C.ink}"/><circle cx="20" cy="-5" r="6" fill="${C.ink}"/><path d="M-8,12 Q0,20 0,12 Q0,20 8,12" stroke="${C.ink}" stroke-width="4" fill="none"/><path d="M-30,10 L-70,4 M-30,18 L-70,22 M30,10 L70,4 M30,18 L70,22" stroke="${C.ink}" stroke-width="3"/>`,`translate(${x},${y}) scale(${s})`);}
function dog(x,y,s){return G(`<ellipse cx="-52" cy="-5" rx="20" ry="40" fill="#8d5a3b" stroke="${C.ink}" stroke-width="5" transform="rotate(20,-52,-5)"/><ellipse cx="52" cy="-5" rx="20" ry="40" fill="#8d5a3b" stroke="${C.ink}" stroke-width="5" transform="rotate(-20,52,-5)"/><ellipse cx="0" cy="0" rx="55" ry="52" fill="#e9c08f" stroke="${C.ink}" stroke-width="5"/><circle cx="-20" cy="-8" r="6" fill="${C.ink}"/><circle cx="20" cy="-8" r="6" fill="${C.ink}"/><ellipse cx="0" cy="14" rx="12" ry="8" fill="${C.ink}"/><path d="M0,22 L0,30 Q-10,38 -16,30 M0,30 Q10,38 16,30" stroke="${C.ink}" stroke-width="4" fill="none"/>`,`translate(${x},${y}) scale(${s})`);}
function house(x,y,s){return G(`<rect x="-170" y="60" width="340" height="40" fill="#bfc4c9" stroke="${C.ink}" stroke-width="5"/><rect x="-130" y="-60" width="260" height="122" fill="#fff4dc" stroke="${C.ink}" stroke-width="6"/><polygon points="-160,-55 0,-160 160,-55" fill="#c0504d" stroke="${C.ink}" stroke-width="6" stroke-linejoin="round"/><rect x="-30" y="0" width="60" height="62" fill="#a8774a" stroke="${C.ink}" stroke-width="5"/><rect x="-105" y="-20" width="55" height="45" fill="#bfe3ff" stroke="${C.ink}" stroke-width="5"/><rect x="50" y="-20" width="55" height="45" fill="#bfe3ff" stroke="${C.ink}" stroke-width="5"/>`,`translate(${x},${y}) scale(${s})`);}
function sparkle(x,y,r,c='#ffd43b'){return `<path d="M${x},${y-r} Q${x+r*0.15},${y-r*0.15} ${x+r},${y} Q${x+r*0.15},${y+r*0.15} ${x},${y+r} Q${x-r*0.15},${y+r*0.15} ${x-r},${y} Q${x-r*0.15},${y-r*0.15} ${x},${y-r} Z" fill="${c}" stroke="${C.ink}" stroke-width="4"/>`;}
function cross(x,y,r,k){if(k<=0)return '';return G(`<path d="M${x-r},${y-r} L${x+r},${y+r} M${x+r},${y-r} L${x-r},${y+r}" stroke="#fff" stroke-width="44" stroke-linecap="round"/><path d="M${x-r},${y-r} L${x+r},${y+r} M${x+r},${y-r} L${x-r},${y+r}" stroke="${C.red}" stroke-width="28" stroke-linecap="round"/>`,scaleAt(x,y,k));}

// ---------- character ----------
function arm(p0,p1,p2,sleeve,hand){
  const d=`M${p0} Q${p1} ${p2}`;
  return `<path d="${d}" fill="none" stroke="${C.line}" stroke-width="34" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${sleeve}" stroke-width="24" stroke-linecap="round"/><circle cx="${p2[0]}" cy="${p2[1]}" r="15" fill="${hand}" stroke="${C.line}" stroke-width="5"/>`;
}
function chara(o){
  const t=o.t||0,boss=o.kind==='boss',work=o.outfit==='work';
  const face=o.face||'normal',pose=o.arms||'down';
  const sleeve=work?C.work:'#fff',hand=work?C.glove:C.skin,hand2=C.skin;
  let s='';
  // legs
  const wk=o.walk?Math.sin(t*o.walk):0;
  const legC=work?C.workD:C.pants,shoeC=work?'#2b2b2b':C.shoe;
  for(const sx of [-1,1]){const lift=Math.max(0,sx*wk)*14;
    s+=`<path d="M${sx*22},-60 L${sx*24},${-14-lift}" stroke="${C.line}" stroke-width="40" stroke-linecap="round"/><path d="M${sx*22},-60 L${sx*24},${-14-lift}" stroke="${legC}" stroke-width="30" stroke-linecap="round"/>`;
    s+=`<ellipse cx="${sx*30}" cy="${-8-lift}" rx="28" ry="14" fill="${shoeC}" stroke="${C.line}" stroke-width="5"/>`;}
  // torso
  const bw=boss?1.12:1;
  const tor=`M${-52*bw},-148 Q${-60*bw},-90 ${-52*bw},-40 L${52*bw},-40 Q${60*bw},-90 ${52*bw},-148 Q0,-160 ${-52*bw},-148 Z`;
  if(work){
    s+=`<path d="${tor}" fill="${C.work}" stroke="${C.line}" stroke-width="6"/>`;
    s+=`<line x1="0" y1="-150" x2="0" y2="-42" stroke="${C.workD}" stroke-width="4"/><rect x="${-40*bw}" y="-125" width="28" height="24" rx="3" fill="${C.workD}" stroke="${C.line}" stroke-width="3"/>`;
    s+=`<path d="M-26,-152 L0,-130 L26,-152" fill="none" stroke="${C.line}" stroke-width="5"/><rect x="${-52*bw}" y="-62" width="${104*bw}" height="10" fill="${C.workD}"/>`;
    if(!boss) s+=`<rect x="14" y="-122" width="30" height="20" rx="3" fill="${C.green}" stroke="${C.line}" stroke-width="3"/>`+T(29,-112,'新人',{size:13,fill:'#fff'});
    else s+=`<rect x="10" y="-124" width="36" height="22" rx="3" fill="#fff" stroke="${C.line}" stroke-width="3"/>`+T(28,-113,'所長',{size:14,fill:C.red});
  }else{
    s+=`<path d="${tor}" fill="#fff" stroke="${C.line}" stroke-width="6"/>`;
    s+=`<path d="M-52,-148 L-16,-152 L0,-96 L-4,-40 L-52,-40 Q-60,-90 -52,-148 Z" fill="${C.vest}" stroke="${C.line}" stroke-width="5"/><path d="M52,-148 L16,-152 L0,-96 L4,-40 L52,-40 Q60,-90 52,-148 Z" fill="${C.vest}" stroke="${C.line}" stroke-width="5"/>`;
    for(const by of [-84,-68,-52])s+=`<circle cx="-9" cy="${by}" r="3.5" fill="#c9a26a"/>`;
    s+=`<path d="M-22,-156 L-4,-136 L-2,-154 Z M22,-156 L4,-136 L2,-154 Z" fill="#fff" stroke="${C.line}" stroke-width="4" stroke-linejoin="round"/>`;
  }
  // arms
  const L=[-48*bw,-138],R=[48*bw,-138];let front='',back='';
  const wave=Math.sin(t*10)*14;
  const shake=pose==='panic'?Math.sin(t*40)*6:0;
  const A={down:[[-62,-100],[-64,-62],[62,-100],[64,-62]],
    wave:[[-62,-100],[-64,-62],[98,-155],[100+wave,-222]],
    panic:[[-100,-170],[-92+shake,-238],[100,-170],[92-shake,-238]],
    point:[[-62,-100],[-64,-62],[100,-142],[156,-150]],
    think:[[-62,-100],[-64,-62],[85,-90],[34,-162]],
    scratch:[[-62,-100],[-64,-62],[110,-200],[78,-300]],
    cross:[[-70,-95],[28,-104],[70,-98],[-28,-110]],

const DEFS=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#d9efff"/></linearGradient>

<pattern id="tone" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="9" cy="9" r="2.6" fill="#000" opacity=".09"/></pattern></defs>`;
function frame(t){
  UID=0;t=clamp(t,0,TOTAL-0.0001);
  let i=0;while(i<S.length-1&&t>=STARTS[i+1])i++;
  const lt=t-STARTS[i],TR=0.45;let out=DEFS;
  if(lt<TR&&i>0){
    out+=S[i-1].draw(S[i-1].dur-0.01);
    const p=eo(lt/TR),X=-300+(W+700)*p;
    out+=`<clipPath id="wipe"><polygon points="-10,-10 ${X+250},-10 ${X-250},${H+10} -10,${H+10}"/></clipPath><g clip-path="url(#wipe)">${S[i].draw(lt)}</g>`;
    out+=`<line x1="${X+250}" y1="-10" x2="${X-250}" y2="${H+10}" stroke="#151515" stroke-width="14"/>`;
  }else out+=S[i].draw(lt);
  // fade from / to black
  const fo=Math.max(clamp(1-t/0.4),clamp((t-(TOTAL-0.6))/0.6));
  if(fo>0)out+=`<rect width="${W}" height="${H}" fill="#000" opacity="${fo}"/>`;
  return out;
}
