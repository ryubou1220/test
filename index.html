<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新生弓木神楽組｜弓木神楽保存会</title>
  <meta name="description" content="弓木神楽保存会 新生弓木神楽組の情報共有サイト。お知らせ、稽古・奉納の予定、連絡事項を掲載しています。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" aria-hidden="true">神</span>
        <span class="brand-text">
          <small>弓木神楽保存会</small>
          新生弓木神楽組
        </span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav">メニュー</button>
      <nav id="nav" class="nav">
        <a href="#news">お知らせ</a>
        <a href="#schedule">予定</a>
        <a href="#notice">連絡事項</a>
        <a href="#about">組について</a>
        <a href="#contact">連絡先</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap">
        <p class="hero-kicker">弓木神楽保存会</p>
        <h1>新生弓木神楽組</h1>
        <p class="hero-lead">受け継がれてきた神楽を、次の世代へ。<br>組員・関係者のための情報共有ページです。</p>
        <div class="hero-next" id="next-event" hidden>
          <span class="label">次の予定</span>
          <strong id="next-title"></strong>
          <span id="next-when"></span>
        </div>
      </div>
    </section>

    <section id="news" class="section">
      <div class="wrap">
        <h2 class="section-title"><span>お知らせ</span></h2>
        <ul class="news-list" id="news-list"></ul>
      </div>
    </section>

    <section id="schedule" class="section section-alt">
      <div class="wrap">
        <h2 class="section-title"><span>稽古・奉納の予定</span></h2>
        <div class="filter" role="tablist" aria-label="予定の種類">
          <button class="chip is-active" data-filter="all">すべて</button>
          <button class="chip" data-filter="稽古">稽古</button>
          <button class="chip" data-filter="奉納">奉納・公演</button>
          <button class="chip" data-filter="会合">会合</button>
        </div>
        <div class="schedule" id="schedule-list"></div>
        <details class="past">
          <summary>終わった予定を見る</summary>
          <div class="schedule" id="past-list"></div>
        </details>
      </div>
    </section>

    <section id="notice" class="section">
      <div class="wrap">
        <h2 class="section-title"><span>組員への連絡事項</span></h2>
        <div class="cards" id="notice-list"></div>
      </div>
    </section>

    <section id="about" class="section section-alt">
      <div class="wrap about">
        <h2 class="section-title"><span>組について</span></h2>
        <div class="about-body" id="about-body"></div>
        <dl class="facts" id="about-facts"></dl>
      </div>
    </section>

    <section id="contact" class="section">
      <div class="wrap">
        <h2 class="section-title"><span>連絡先</span></h2>
        <dl class="facts" id="contact-list"></dl>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© <span id="year"></span> 弓木神楽保存会 新生弓木神楽組</p>
      <p class="updated">最終更新：<span id="updated"></span></p>
    </div>
  </footer>

  <script src="data/site-data.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
