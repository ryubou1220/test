    --bg: #121814; --surface: #1a221d; --ink: #e5ebe6; --muted: #9eaca2; --line: #2d3931;
    --accent: #74c296; --accent-ink: #0c1810; --accent-soft: #1d3127;
    --wood: #d7a46d; --wood-soft: #3a2c1f; --paper: #f4f2ec; --warn: #f0a670;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1a221d; --ink: #e5ebe6; --muted: #9eaca2; --line: #2d3931;
  --accent: #74c296; --accent-ink: #0c1810; --accent-soft: #1d3127;
  --wood: #d7a46d; --wood-soft: #3a2c1f; --paper: #f4f2ec; --warn: #f0a670;
  color-scheme: dark;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.85; font-variant-numeric: tabular-nums; }

.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; }

section + section { border-top: 1px solid var(--line); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-size: clamp(24px, 3.6vw, 34px); font-weight: 900; line-height: 1.4; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--accent); margin-bottom: 10px; }
.lead { color: var(--muted); max-width: 40em; margin: 14px 0 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 700; border-radius: 10px; padding: 14px 22px; background: var(--accent); color: var(--accent-ink); border: 2px solid var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn small { font-weight: 400; opacity: .85; }
.btn:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--wood); outline-offset: 3px; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }

/* ヒーロー */
.hero { padding-block: 64px 56px; }
.hero .wrap { max-width: 820px; }
.hero-grid { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr); align-items: center; }
@media (min-width: 860px) { .hero-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
.hero h1 { font-size: clamp(30px, 5.4vw, 52px); font-weight: 900; line-height: 1.3; letter-spacing: .01em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .sub { font-size: clamp(16px, 2vw, 19px); margin: 18px 0 0; }
.badges { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 22px; font-size: 14px; color: var(--muted); }
.badges b { color: var(--ink); }

/* ヒーローの図：つくる作品の並び */
.hero-visual { background: var(--paper); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; color: #1b231e; box-shadow: 0 1px 0 var(--line); }
.hv { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; counter-reset: none; }
.hv li { display: grid; gap: 4px; justify-items: center; align-content: end; border: 1px solid #e3e6df; border-radius: 10px; padding: 10px 8px 8px; }
.hv img { height: 104px; width: auto; }
.hv span, .hv-goal span { font-size: 14px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.hv b { width: 22px; height: 22px; border-radius: 50%; background: #2c6849; color: #fff; display: grid; place-items: center; font-size: 12px; }
.hv-goal { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; border: 2px solid #2c6849; border-radius: 10px; padding: 10px 14px; }
.hv-goal img { height: 92px; width: auto; }
.hv-goal span { flex-direction: column; align-items: flex-start; gap: 0; font-size: 20px; font-weight: 900; }
.hv-goal small { font-size: 12px; color: #2c6849; letter-spacing: .1em; }

/* 道のり：5つの作品を1列に */
.road { display: grid; gap: 12px; margin-top: 28px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.stepcard { display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 16px; min-width: 0; }
.stepcard .art { background: var(--paper); border-radius: 8px; display: grid; place-items: center; height: 120px; padding: 8px; }
.stepcard .art img { max-height: 104px; width: auto; }
.stepno { font-size: 12px; font-weight: 700; letter-spacing: .1em; color: var(--accent); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.stepno .free { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 8px; letter-spacing: 0; }
.stepcard h3 { font-size: 18px; font-weight: 900; line-height: 1.4; }
.skill { margin: 0; font-size: 14px; line-height: 1.6; }
.facts { font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); }
.stepcard.goal { border: 2px solid var(--accent); }

/* 悩みと答え */
.qa { display: grid; gap: 14px; margin-top: 32px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.qa div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 6px; }
.qa b { font-size: 17px; }
.qa p { margin: 0; color: var(--muted); font-size: 15px; }

/* 価格 */
.price-table { width: 100%; border-collapse: collapse; margin-top: 28px; font-size: 15px; }
.tablewrap { overflow-x: auto; }
.price-table th, .price-table td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.price-table th { font-size: 13px; color: var(--muted); font-weight: 700; }
.price-table td.r, .price-table th.r { text-align: right; white-space: nowrap; }
.price-table .yen { font-size: 20px; font-weight: 900; }
.price-table tr.set td { background: var(--accent-soft); }
.price-table small { display: block; color: var(--muted); font-size: 13px; }
.course-box { margin-top: 28px; background: var(--surface); border: 2px solid var(--accent); border-radius: var(--r); padding: 26px; display: grid; gap: 14px; }
.course-box h3 { font-size: 22px; font-weight: 900; }
.course-box ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.course-box .yen { font-size: 30px; font-weight: 900; }
.guarantee { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; font-size: 15px; }

/* 監修者 */
.prof { display: grid; gap: 28px; margin-top: 28px; grid-template-columns: minmax(0, 1fr); }

.prof dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 16px 0 0; }
.prof dt { color: var(--muted); }
.prof dd { margin: 0; }
.works { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.works figure { margin: 0; display: grid; gap: 6px; }
.works img { border-radius: 10px; aspect-ratio: 3 / 2; object-fit: cover; width: 100%; height: auto; }
.works figcaption { font-size: 13px; color: var(--muted); }

/* 声 */
.voices { display: grid; gap: 18px; margin-top: 28px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.voice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 12px; align-content: start; }
.voice blockquote { margin: 0; font-family: var(--font-quote); font-size: 18px; line-height: 1.8; }
.voice .who { font-size: 14px; color: var(--muted); }
.voice .num { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; }
.voice .num b { font-size: 20px; }
.note { font-size: 13px; color: var(--muted); }

/* FAQ */
.faq { margin-top: 24px; display: grid; gap: 10px; }
.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
.faq summary { cursor: pointer; font-weight: 700; }
.faq p { margin: 10px 0 0; color: var(--muted); }

.final { text-align: center; }
.final h2 { max-width: 20em; margin-inline: auto; }
.final .ctas { justify-content: center; }
footer { padding-block: 32px 48px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
footer .links { display: flex; flex-wrap: wrap; gap: 8px 20px; }

/* 印刷・PDF：A4・4ページに割り付ける

@page { size: A4; margin: 12mm 12mm 12mm; }
@media print {
  :root, :root[data-theme="dark"] {
    --bg: #ffffff; --surface: #ffffff; --ink: #1b231e; --muted: #58655c; --line: #d5dcd2;
    --accent: #2c6849; --accent-ink: #ffffff; --accent-soft: #e3eee6; --wood: #b07a45; --wood-soft: #f2e5d4; --paper: #ffffff;
    color-scheme: light;
  }
  body { font-size: 11pt; line-height: 1.65; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .wrap { max-width: none; padding-inline: 0; }
  section, .hero { padding-block: 0; }
  section + section { border-top: 0; }
  section { margin-top: 10mm; }
  #price, #voice, #faq { break-before: page; page-break-before: always; margin-top: 0; }
  .hero h1 { font-size: 26pt; }
  h2 { font-size: 17pt; }
  .eyebrow, h2, h3, .stepno { break-after: avoid; page-break-after: avoid; }
  .road { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3mm; margin-top: 6mm; }
  .stepcard .art { height: 28mm; }
  .stepcard .art img { max-height: 24mm; }
  .stepcard, .course-box, .voice, .price-table tr, .works figure, .faq details, .final { break-inside: avoid; page-break-inside: avoid; }
  .price-table { margin-top: 5mm; }
  .price-table th, .price-table td { padding: 2.5mm 3mm; }
  .course-box { margin-top: 6mm; padding: 6mm; gap: 3mm; }
  .voices { margin-top: 5mm; gap: 4mm; }
  .voice { padding: 5mm; gap: 2mm; }
  .voice blockquote { font-size: 11pt; }
  .prof { margin-top: 4mm; gap: 4mm; }
  .final { margin-top: 14mm; }
  .faq details:not([open]) > p { display: none; }
  .ctas { margin-top: 6mm; }
  .ctas .btn { padding: 3mm 6mm; }
  .edbar, .ed-btn { display: none !important; }
  footer { border-top: 1px solid var(--line); margin-top: 12mm; padding-block: 4mm 0; }
}

/* 編集モード（編集できる人だけに表示） */
[contenteditable] { outline: 1.5px dashed var(--wood); outline-offset: 2px; border-radius: 3px; cursor: text; min-width: 1em; display: inline-block; }

.ed-noimg { display: grid; place-items: center; aspect-ratio: 3 / 2; width: 100%; min-width: 160px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; }
.ed-faq { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; display: grid; gap: 6px; }
.ed-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 6px; }
.edbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 2px solid var(--accent); box-shadow: 0 -4px 16px rgba(0, 0, 0, .12); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.edbar .ed-in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.edbar button { font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 8px; padding: 8px 14px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.edbar button.ed-main { background: var(--accent); color: var(--accent-ink); }
.edbar button:disabled { opacity: .6; cursor: default; }
.edbar button:focus-visible, .ed-btn:focus-visible { outline: 3px solid var(--wood); outline-offset: 2px; }
.ed-hint, .ed-msg { font-size: 13px; color: var(--muted); }
.ed-msg { color: var(--ink); font-weight: 700; }
.ed-links { max-width: 1040px; margin: 0 auto 10px; display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); max-height: 46vh; overflow-y: auto; }
.ed-field { display: grid; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.ed-field input { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
body:has(.edbar:not([hidden])) footer { padding-bottom: 120px; }

    "n2v": "高さ1m",
    "quote": "部屋から庭までの高さが１メートルあり、どう作ったらいいのか答えが出なくなりました。そこでアドバイスと計画図を提供してくれて二段デッキにすることでスタートすることになりました。",
    "who": "よしひろ さん（40代・自営業・DIY歴1年）　3.7m×4.0m　令和元年7月"
   }
  ],
  "note": "いただいた感想から一部を抜粋しています。個人の感想です。"
 },
 "author": {
  "eyebrow": "監修者",
  "name": "野村 隆一",
  "paras": [
   "建設関係の仕事に35年。2003年に自宅のウッドデッキをつくって以来、フェンス・門扉・囲炉裏テーブルなどを手がけ、ほかの方のデッキづくりも支えてきました。"
  ],
  "works": [
   {
    "img": "photos/bench-crop.jpg",
    "cap": "すのこ張りのベンチ。STEP2の「すき間をそろえて張る」技術でつくれる。"
   },
   {
    "img": "photos/irori-crop.jpg",
    "cap": "デッキの上で使い続けている囲炉裏テーブル"
   },
   {
    "img": "photos/irori-open-crop.jpg",
    "cap": "ふたを外すと炉。内側はケイカル板に耐熱塗料"
   }
  ]
 },
 "faq": {
  "h2": "よくある質問",
  "items": [
   {
    "q": "工具を1つも持っていません。",
    "a": "STEP1に必要なのは、さしがね・メジャー・ノコギリ・インパクトドライバー（またはドライバードリル）です。木材はホームセンターのカットサービスで切ってもらうこともできます。教材の「道具と材料」のページに、必要なものをチェックリストでまとめています。"
   },
   {
    "q": "途中のステップから始められますか？",
    "a": "はい。どのステップも単品で使えます。ただ、STEP2はSTEP1で余った材料を使う設計なので、順番に進めると材料のムダが出ません。"
   },
   {
    "q": "ウッドデッキの材料費は、どのくらいかかりますか？",
    "a": "大きさと木材によって、約10〜30万円です。無料の計算ツールで、幅・奥行き・高さを入れると、材料の本数と費用の目安がわかります。"
   }
  ]
 },
 "final": {
  "h2": "最初の一歩は、半日でつくれる踏み台から。",
  "lead": "材料費は約2,600円。半日でつくれます。",
  "btn": "STEP1「踏み台」を無料で受け取る"
 },
 "footer": {
  "law": "特定商取引法に基づく表記",
  "site": "Ryu'フェニックス",
  "credit": "週末DIY 5ステップ講座　監修：野村 隆一"
 }
}</script>
<script id="page-script">(function () {
  // ページの中身はすべて #content のデータから描く。編集すると、データを書き換えて丸ごと保存し直す。
  const S = JSON.parse(document.getElementById('content').textContent);
  const app = document.getElementById('app');
  const bar = document.getElementById('edbar');
  const FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Old+Mincho:wght@700&display=swap">';
  const RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';

  let editing = false, dirty = false, linksOpen = false, busy = false;
  let canEdit = false, art = null, assets = null, downloads = null, imgTarget = null;
  let message = '';

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const get = (p) => p.split('.').reduce((o, k) => (o == null ? o : o[k]), S);
  const set = (p, v) => {
    const ks = p.split('.'), last = ks.pop();
    ks.reduce((o, k) => o[k], S)[last] = v;
    if (!dirty) { dirty = true; renderBar(); }
  };

  // 編集できる文字
  const T = (p, tag = 'span', cls = '') => `<${tag}${cls ? ` class="${cls}"` : ''} data-k="${p}"${editing ? ' contenteditable="plaintext-only" spellcheck="false"' : ''}>${esc(get(p))}</${tag}>`;
  // 差し替えできる画像
  const IMG = (p, alt, extra = '') => {
    const src = get(p);
    const pic = src ? `<img src="${esc(src)}" alt="${esc(alt)}"${extra}>` : `<span class="ed-noimg">写真がありません</span>`;
    return editing ? `<span class="ed-imgwrap">${pic}<button type="button" class="ed-btn ed-img" data-img="${p}">写真を変える</button></span>` : pic;
  };
  // リンク付きのボタン（行き先は「リンク設定」で決める。未設定ならページ内の料金欄へ）
  const LINK = (name, labelPath, cls, fallback = '#price') => {
    const url = S.links[name];
    return `<a class="${cls}" href="${esc(url || fallback)}"${url ? ' target="_blank" rel="noopener"' : ''}>${T(labelPath)}</a>`;
  };
  const DEL = (p, what) => (editing ? `<button type="button" class="ed-btn ed-del" data-del="${p}" aria-label="${what}を削除">削除</button>` : '');
  const ADD = (p, what) => (editing ? `<button type="button" class="ed-btn ed-add" data-add="${p}">＋ ${what}を追加</button>` : '');
  const each = (p, fn) => get(p).map((_, i) => fn(`${p}.${i}`, i)).join('');

  const NEW = {
    'hero.badges': () => ({ k: '項目', v: '内容' }),
    'road.steps': () => ({ no: 'STEP', tag: '', title: '作品名', img: '', skill: '覚えること', facts: [{ k: '材料費', v: '約○円' }] }),
    'price.rows': () => ({ name: '商品名', desc: '内容', sub: '', price: '○円', set: false }),
    'price.course.items': () => '内容',
    'voice.items': () => ({ n1k: '項目', n1v: '数字', n2k: '項目', n2v: '数字', quote: '感想', who: 'お名前（年代・職業）' }),
    'author.paras': () => '文章',
    'author.works': () => ({ img: '', cap: '写真の説明' }),
    'faq.items': () => ({ q: '質問', a: '答え' }),
  };

  function stepCard(p, goal) {
    const s = get(p);
    return `<article class="stepcard${goal ? ' goal' : ''}">
      <div class="art">${IMG(p + '.img', s.title + 'の図', ' width="220" height="160"')}</div>
      <div class="stepno">${T(p + '.no')}${s.tag || editing ? ` ${T(p + '.tag', 'span', s.tag ? 'free' : 'free ed-empty')}` : ''}</div>
      ${T(p + '.title', 'h3')}
      ${T(p + '.skill', 'p', 'skill')}
      <div class="facts">${each(p + '.facts', (f) => `<span>${T(f + '.k')} <b>${T(f + '.v')}</b></span>`)}</div>
      ${goal ? '' : DEL(p, 'ステップ')}
    </article>`;
  }

  function render() {
    const faqItem = (p) => editing
      ? `<div class="ed-faq">${T(p + '.q', 'b')}${T(p + '.a', 'p')}${DEL(p, '質問')}</div>`
      : `<details><summary>${esc(get(p + '.q'))}</summary><p>${esc(get(p + '.a'))}</p></details>`;
    app.innerHTML = `
<header class="hero">
  <div class="wrap">
    ${T('hero.eyebrow', 'div', 'eyebrow')}
    <h1>${T('hero.h1a')}<em>${T('hero.h1em')}</em>${T('hero.h1b')}</h1>
    ${T('hero.sub', 'p', 'sub')}
    <div class="ctas">${LINK('step1', 'hero.cta1', 'btn')}</div>
    <div class="badges">${each('hero.badges', (b) => `<span>${T(b + '.k')} <b>${T(b + '.v')}</b>${DEL(b, '項目')}</span>`)}${ADD('hero.badges', '項目')}</div>
  </div>
</header>
<main>
<section id="road"><div class="wrap">
  ${T('road.eyebrow', 'div', 'eyebrow')}${T('road.h2', 'h2')}
  <div class="road">
    ${each('road.steps', (p) => stepCard(p, false))}
    ${stepCard('road.goal', true)}
  </div>
  ${ADD('road.steps', 'ステップ')}
</div></section>

<section id="price"><div class="wrap">
  ${T('price.eyebrow', 'div', 'eyebrow')}${T('price.h2', 'h2')}
  <div class="tablewrap"><table class="price-table">
    <thead><tr><th>ステップ</th><th>内容</th><th class="r">価格</th></tr></thead>
    <tbody>${each('price.rows', (r) => `<tr${get(r + '.set') ? ' class="set"' : ''}><td>${T(r + '.name', 'b')}${DEL(r, '行')}</td><td>${T(r + '.desc')}${get(r + '.sub') || editing ? T(r + '.sub', 'small') : ''}</td><td class="r">${T(r + '.price', 'span', 'yen')}</td></tr>`)}</tbody>
  </table></div>
  ${ADD('price.rows', '行')}
  <div class="course-box">
    ${T('price.course.label', 'div', 'stepno')}${T('price.course.title', 'h3')}
    <ul>${each('price.course.items', (it) => `<li>${T(it)}${DEL(it, '項目')}</li>`)}</ul>
    ${ADD('price.course.items', '項目')}
    <div>${T('price.course.price', 'span', 'yen')}${T('price.course.priceNote', 'span', 'note')}</div>
    ${T('price.course.guarantee', 'p', 'guarantee')}
    <div class="ctas" style="margin-top:4px">${LINK('course', 'price.course.btn1', 'btn')}</div>
  </div>
</div></section>

<section id="voice"><div class="wrap">
  ${T('voice.h2', 'h2')}
  <div class="voices">${each('voice.items', (v) => `<div class="voice">
    <div class="num"><span>${T(v + '.n1k')} <b>${T(v + '.n1v')}</b></span><span>${T(v + '.n2k')} <b>${T(v + '.n2v')}</b></span></div>
    ${T(v + '.quote', 'blockquote')}${T(v + '.who', 'div', 'who')}${DEL(v, '声')}</div>`)}</div>
  ${ADD('voice.items', '声')}
  ${T('voice.note', 'p', 'note')}
</div></section>

<section id="author"><div class="wrap">
  ${T('author.eyebrow', 'div', 'eyebrow')}${T('author.name', 'h2')}
  <div class="prof">
    <div>
      ${each('author.paras', (p) => `<div class="ed-row">${T(p, 'p')}${DEL(p, '段落')}</div>`)}${ADD('author.paras', '段落')}
    </div>
    <div class="works">${each('author.works', (w) => `<figure>${IMG(w + '.img', get(w + '.cap'), ' loading="lazy"')}${T(w + '.cap', 'figcaption')}${DEL(w, '写真')}</figure>`)}${ADD('author.works', '写真')}</div>
  </div>
</div></section>

<section id="faq"><div class="wrap">
  ${T('faq.h2', 'h2')}
  <div class="faq">${each('faq.items', faqItem)}</div>
  ${ADD('faq.items', '質問')}
</div></section>

<section class="final"><div class="wrap">
  ${T('final.h2', 'h2')}${T('final.lead', 'p', 'lead')}
  <div class="ctas">${LINK('step1', 'final.btn', 'btn')}</div>
</div></section>
</main>
<footer><div class="wrap">
  <div class="links">${LINK('law', 'footer.law', '')}${LINK('site', 'footer.site', '')}</div>
  ${T('footer.credit', 'p')}
</div></footer>`;
    document.title = S.meta.title;
  }

  // ===== 編集バー =====
  function renderBar() {
    if (!canEdit) { bar.hidden = true; return; }
    bar.hidden = false;
    const msg = message ? `<span class="ed-msg" role="status">${esc(message)}</span>` : '';
    if (!editing) {
      bar.innerHTML = `<div class="ed-in"><button type="button" class="ed-main" data-act="edit">編集する</button>${downloads ? '<button type="button" data-act="export">HTMLを書き出す</button>' : ''}${msg}</div>`;
      return;
    }
    const L = (k, label, hint) => `<label class="ed-field"><span>${label}</span><input type="url" data-link-k="${k}" value="${esc(S.links[k])}" placeholder="${hint}"></label>`;
    bar.innerHTML = `${linksOpen ? `<div class="ed-links">
        ${L('step1', 'STEP1を無料で受け取る（LINE登録）', 'https://lin.ee/…')}
        ${L('course', 'ウッドデッキ完成コースの申し込み', 'https://…')}
        ${L('calc', '材料費の計算ツール', 'https://…')}
        ${L('law', '特定商取引法に基づく表記', 'https://…')}
        ${L('site', 'サイト', 'https://…')}
        <label class="ed-field"><span>ページの名前（ブラウザのタブ）</span><input type="text" data-meta-k="title" value="${esc(S.meta.title)}"></label>
        <label class="ed-field"><span>ページの説明（検索結果に出る文）</span><input type="text" data-meta-k="description" value="${esc(S.meta.description)}"></label>
      </div>` : ''}
      <div class="ed-in">
        <button type="button" class="ed-main" data-act="save"${busy ? ' disabled' : ''}>${busy ? '保存中…' : dirty ? '保存する' : '保存する（変更なし）'}</button>
        <button type="button" data-act="cancel"${busy ? ' disabled' : ''}>やめる</button>
        <button type="button" data-act="links" aria-expanded="${linksOpen}">リンクとページ設定</button>
        <span class="ed-hint">文字は直接クリックして書き換えられます。</span>${msg}
      </div>`;
  }

  // ===== 保存するページ全体を、データから組み立てる =====
  function buildDoc() {
    const css = document.getElementById('page-style').textContent;
    const code = document.getElementById('page-script').textContent;
    const json = JSON.stringify(S, null, 1).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
      + `<title>${esc(S.meta.title)}</title>\n<meta name="description" content="${esc(S.meta.description)}">\n${FONTS}\n`
      + `<style id="page-style">${css}</style>\n<div id="app"></div>\n<div id="edbar" class="edbar" hidden></div>\n`
      + `<script type="application/json" id="content">${json}<\/script>\n<script id="page-script">${code}<\/script>\n</body></html>`;
  }

  const READ_ONLY = ['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'];
  async function save() {
    if (busy) return;
    if (!dirty) { editing = false; linksOpen = false; message = ''; render(); renderBar(); return; }
    busy = true; message = ''; renderBar();
    const html = buildDoc();
    try {
      try {
        await art.publish({ 'index.html': { content: html, contentType: 'text/html' } });
      } catch (e) {
        if (!e || e.code !== 'capability_disabled') throw e;
        await art.publish(html);
      }
      dirty = false; editing = false; linksOpen = false; message = '保存しました。';
      render();
    } catch (e) {
      const code = e && e.code;
      if (code === 'conflict') message = 'ほかの画面で先に保存されていました。最新の内容を読み込み直します。';
      else if (READ_ONLY.includes(code)) { message = 'この画面からは保存できません（閲覧のみ）。'; canEdit = false; editing = false; render(); }
      else if (code === 'too_large') message = 'ページが大きすぎて保存できません。写真を小さくしてください。';
      else if (code === 'rate_limited') message = '保存が続いています。少し待ってから、もう一度保存してください。';
      else message = '保存できませんでした。もう一度「保存する」を押してください。';
    }
    busy = false; renderBar();
  }

  async function exportHtml() {
    if (!downloads) return;
    try {
      await downloads.save({ filename: 'index.html', data: buildDoc() });
      message = '書き出しました。自分のサイトに置くときは、img と photos のフォルダも一緒に置いてください。';
    } catch (e) {
      message = e && e.code === 'declined' ? '' : '書き出せませんでした。';
    }
    renderBar();
  }

  // ===== 操作 =====
  app.addEventListener('input', (e) => {
    const k = e.target.closest('[data-k]');
    if (k && editing) set(k.dataset.k, k.textContent.replace(/ /g, ' ').trim());
  });
  app.addEventListener('click', (e) => {
    if (!editing) return;
    const a = e.target.closest('a');
    if (a) e.preventDefault();
    const del = e.target.closest('[data-del]');
    if (del) {
      const p = del.dataset.del, ks = p.split('.'), i = Number(ks.pop());
      get(ks.join('.')).splice(i, 1); dirty = true; render(); renderBar(); return;
    }
    const add = e.target.closest('[data-add]');
    if (add) {
      const p = add.dataset.add;
      get(p).push(NEW[p] ? NEW[p]() : (p.endsWith('.facts') ? { k: '項目', v: '内容' } : '')); dirty = true; render(); renderBar(); return;
    }
    const img = e.target.closest('[data-img]');
    if (img) {
      if (!assets) { message = '写真の差し替えは、編集できる人の画面でだけ使えます。'; renderBar(); return; }
      imgTarget = img.dataset.img; fileInput.click();
    }
  });
  app.addEventListener('keydown', (e) => {
    if (editing && e.key === 'Enter' && e.target.closest('[data-k]') && !e.target.closest('p, blockquote, figcaption')) e.preventDefault();
  });

  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.hidden = true;
  document.body.appendChild(fileInput);
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f || !imgTarget) return;
    message = '写真を送っています…'; renderBar();
    try {
      const r = await assets.upload(f);
      set(imgTarget, r.url); message = '写真を差し替えました。「保存する」で確定します。'; render();
    } catch (e) {
      message = e && e.code === 'too_large' ? '写真が大きすぎます（20MBまで）。' : '写真を送れませんでした。';
    }
    renderBar();
  });

  bar.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    if (a === 'edit') { editing = true; message = ''; render(); renderBar(); }
    else if (a === 'cancel') { location.reload(); }
    else if (a === 'save') save();
    else if (a === 'links') { linksOpen = !linksOpen; renderBar(); }
    else if (a === 'export') exportHtml();
  });
  bar.addEventListener('input', (e) => {
    const l = e.target.dataset.linkK, m = e.target.dataset.metaK;
    if (l) S.links[l] = e.target.value.trim();
    if (m) S.meta[m] = e.target.value;
    if ((l || m) && !dirty) { dirty = true; const sb = bar.querySelector('[data-act=save]'); if (sb) sb.textContent = '保存する'; }
  });
  bar.addEventListener('change', () => render()); // リンク先をボタンに反映（入力欄は作り直さない）

  render();

  // 編集できる人にだけ、編集バーを出す（claude.ai の上で開いたときだけ）
  (async () => {
    if (!window.claude || !window.claude.use) return;
    const [a, u, as, dl] = await Promise.all(['artifact', 'user', 'assets', 'downloads'].map((n) => window.claude.use(n).catch(() => null)));
    art = a; assets = as; downloads = dl;
    canEdit = !!(art && u && await u.canEdit().catch(() => false));
    renderBar();
  })();
})();
</script>
</body></html>
