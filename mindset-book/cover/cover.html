<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1d2a44; --bg2: #26365a; --accent: #f26b4f; --gold: #ffc857; --ink: #ffffff; --muted: #b8c3dd; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "M PLUS Rounded 1c", sans-serif; background: var(--bg); color: var(--ink); }
  .stage { position: relative; overflow: hidden; background: radial-gradient(circle at 30% 20%, var(--bg2), var(--bg) 70%); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); }
  .cell { border-radius: 22%; border: 4px solid rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; }
  .cell.on { background: var(--accent); border-color: var(--accent); }
  .cell.on::after { content: ""; width: 38%; height: 20%; border-left: 6px solid #fff; border-bottom: 6px solid #fff; transform: translateY(-18%) rotate(-45deg); }
  .cell.last { background: var(--gold); border-color: var(--gold); }
  .tag { display: inline-block; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.35); border-radius: 999px; color: var(--muted); font-weight: 500; }
  .t1 { font-weight: 800; letter-spacing: .04em; }
  .t2 { font-weight: 800; line-height: 1; white-space: nowrap; }
  .t1, .sub { white-space: nowrap; }
  .t2 .num { color: var(--accent); }
  .sub { font-weight: 500; color: var(--muted); }
  .sub b { color: var(--gold); font-weight: 800; }
  .author { font-weight: 800; letter-spacing: .1em; }

  /* 縦型（Kindle・PDF表紙）1600x2560 */
  .v { width: 1600px; height: 2560px; padding: 150px 140px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .v .tag { font-size: 52px; padding: 18px 56px; }
  .v .grid { width: 900px; gap: 20px; margin: 110px 0 110px; }
  .v .cell { aspect-ratio: 1; }
  .v .t1 { font-size: 150px; }
  .v .t2 { font-size: 168px; margin-top: 30px; }
  .v .t2 .num { font-size: 240px; }
  .v .sub { font-size: 54px; margin-top: 70px; }
  .v .author { font-size: 76px; margin-top: auto; }
  .v .author::before { content: ""; display: block; width: 120px; height: 6px; background: var(--accent); margin: 0 auto 50px; border-radius: 3px; }

  /* 横型（Brain・noteのサムネイル）1280x670 */
  .h { width: 1280px; height: 670px; padding: 60px 70px; display: flex; align-items: center; gap: 70px; }
  .h .grid { width: 420px; flex: none; gap: 10px; }
  .h .cell { aspect-ratio: 1; border-width: 3px; }
  .h .cell.on::after { border-width: 0 0 4px 4px; }
  .h .tag { font-size: 24px; padding: 8px 26px; }
  .h .t1 { font-size: 60px; margin-top: 28px; }
  .h .t2 { font-size: 72px; margin-top: 10px; }
  .h .t2 .num { font-size: 104px; }
  .h .sub { font-size: 27px; margin-top: 30px; }
  .h .author { font-size: 32px; margin-top: 26px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const mode = new URLSearchParams(location.search).get("v") || "v";
  // 64マスのうち、左上から順に埋まっていく（習慣が積み上がるイメージ）
  const filled = 41;
  const cells = Array.from({ length: 64 }, (_, i) =>
    `<div class="cell ${i < filled ? "on" : ""} ${i === filled ? "last" : ""}"></div>`).join("");
  const title = `
    <div class="tag">副業・起業をめざすあなたへ</div>
    <div class="t1">人生を変える</div>
    <div class="t2"><span class="num">64</span>の習慣リスト</div>
    <div class="sub">副業で<b>「最初の1円」</b>をつかむ<br>マインドセット</div>`;
  document.getElementById("root").innerHTML = mode === "v"
    ? `<div class="stage v">
         <div class="tag">副業・起業をめざすあなたへ</div>
         <div class="grid">${cells}</div>
         <div class="t1">人生を変える</div>
         <div class="t2"><span class="num">64</span>の習慣リスト</div>
         <div class="sub">副業で<b>「最初の1円」</b>をつかむためのマインドセット</div>
         <div class="author">りゅう坊</div>
       </div>`
    : `<div class="stage h">
         <div class="grid">${cells}</div>
         <div>${title}<div class="author">りゅう坊</div></div>
       </div>`;
</script>
</body>
</html>
