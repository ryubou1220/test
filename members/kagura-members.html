<title>新生弓木神楽組</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 黒地に紅。上に次の予定と自分の出欠、下はタブで予定・出欠表・お知らせ・連絡・組について。 */
:root {
  color-scheme: dark;
  --bg: #0e0b0b;
  --bg-alt: #161010;
  --surface: #1e1616;
  --surface-2: #281c1c;
  --ink: #f3ece6;
  --ink-soft: #b8a9a3;
  --line: #3a2626;
  --accent: #c8161d;
  --accent-bright: #ff4a4f;
  --accent-ink: #ffffff;
  --gold: #d4a94f;
  --ok: #6fcf8e;
  --ng: #ff6b6b;
  --maybe: #e8c35a;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 15px; line-height: 1.7; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 700; line-height: 1.15; min-width: 0; }
.brand small { display: block; font-size: .68rem; font-weight: 500; color: var(--ink-soft); }
.mark { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
.hero-logo { width: 88px; height: 88px; border-radius: 50%; border: 3px solid var(--accent); box-shadow: 0 0 0 4px rgba(200,22,29,.25), 0 8px 30px rgba(200,22,29,.35); }
.me { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--ink-soft); min-width: 0; }
.me img { width: 26px; height: 26px; border-radius: 50%; }
.me span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 9em; }
.pill-edit { border: 1px solid var(--gold); color: var(--gold); background: none; border-radius: 99px; padding: 2px 10px; font-size: .78rem; white-space: nowrap; }
.pill-edit[aria-pressed="true"] { background: var(--gold); color: #1a1208; }

/* hero */
.hero { background: radial-gradient(ellipse at 90% 0%, rgba(200,22,29,.55), transparent 60%), radial-gradient(ellipse at 0% 100%, rgba(200,22,29,.2), transparent 55%), #070505; border-bottom: 3px solid var(--accent); }
.hero .wrap { padding-block: 28px 24px; display: grid; gap: 14px; }
.hero h1 { margin: 0; font-family: var(--serif); font-size: clamp(1.7rem, 6vw, 2.4rem); letter-spacing: .08em; line-height: 1.3; text-wrap: balance; }
.kicker { margin: 0; color: var(--gold); font-size: .78rem; letter-spacing: .28em; }
.next { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.14); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.next .label { font-size: .74rem; letter-spacing: .12em; color: var(--gold); }
.next .ttl { font-weight: 700; font-size: 1.05rem; }
.next .when { color: var(--ink-soft); font-size: .9rem; }

/* status banner */
.banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); font-size: .88rem; }
.banner.warn { border-color: var(--accent); color: var(--ink); }

/* register */
.register { margin-top: 16px; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
.register h2 { margin: 0; font-size: 1rem; }
.register p { margin: 0; color: var(--ink-soft); font-size: .88rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > input { flex: 1 1 180px; min-width: 0; }

input[type=text], input[type=date], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.danger { border-color: var(--accent-bright); color: var(--accent-bright); background: none; }
.btn.small { padding: 4px 10px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: default; }

/* tabs */
.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs a { flex: none; padding: 12px 12px 10px; color: var(--ink-soft); text-decoration: none; border-bottom: 2px solid transparent; font-size: .92rem; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--accent-bright); font-weight: 700; }

main .wrap { padding-block: 22px 56px; }
.view { display: grid; gap: 14px; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.view-head h2 { margin: 0; font-family: var(--serif); font-size: 1.35rem; display: flex; align-items: center; gap: 10px; }
.view-head h2::before { content: ""; width: 5px; height: 1.2em; background: var(--accent); border-radius: 2px; }
.empty { color: var(--ink-soft); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; margin: 0; }

/* events */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 3px 13px; border-radius: 99px; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.event { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.event.past { opacity: .6; }
.edate { text-align: center; border-right: 1px solid var(--line); padding-right: 10px; line-height: 1.15; }
.edate .m { font-size: .76rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.edate .d { font-family: var(--serif); font-size: 1.9rem; font-weight: 700; }
.edate .w { font-size: .76rem; color: var(--ink-soft); }
.edate .w.sun { color: var(--accent-bright); }
.ebody { display: grid; gap: 6px; min-width: 0; }
.ebody h3 { margin: 0; font-size: 1.02rem; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.meta { margin: 0; color: var(--ink-soft); font-size: .86rem; overflow-wrap: anywhere; }
.note { margin: 0; font-size: .88rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.tag { font-size: .7rem; border: 1px solid var(--accent-bright); color: var(--accent-bright); padding: 0 8px; border-radius: 99px; white-space: nowrap; font-weight: 500; }
.tag.t-稽古 { border-color: #cfc3bd; color: #cfc3bd; }
.tag.t-会合 { border-color: var(--gold); color: var(--gold); }

.rsvp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.rsvp .lbl { font-size: .76rem; color: var(--ink-soft); margin-right: 2px; }
.rb { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 14px; font-size: .86rem; min-height: 34px; }
.rb[aria-pressed="true"][data-s="出"] { background: var(--ok); border-color: var(--ok); color: #08210f; font-weight: 700; }
.rb[aria-pressed="true"][data-s="欠"] { background: var(--ng); border-color: var(--ng); color: #2a0606; font-weight: 700; }
.rb[aria-pressed="true"][data-s="未"] { background: var(--maybe); border-color: var(--maybe); color: #241a02; font-weight: 700; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .82rem; color: var(--ink-soft); align-items: center; }
.counts b { font-variant-numeric: tabular-nums; }
.c-ok { color: var(--ok); } .c-ng { color: var(--ng); } .c-maybe { color: var(--maybe); }
details.who summary { cursor: pointer; font-size: .82rem; color: var(--ink-soft); }
.who ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; font-size: .86rem; }
.who li { display: flex; gap: 8px; }
.who li .n { min-width: 0; overflow-wrap: anywhere; }
.memo-in { display: flex; gap: 6px; }
.memo-in input { flex: 1; min-width: 0; padding: 6px 10px; font-size: .86rem; }
.edit-row { display: flex; gap: 6px; flex-wrap: wrap; }

/* roster */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.roster { border-collapse: collapse; font-size: .85rem; min-width: 100%; }
.roster th, .roster td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: center; white-space: nowrap; }
.roster th:first-child, .roster td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; border-right: 1px solid var(--line); }
.roster thead th { font-weight: 500; color: var(--ink-soft); font-size: .76rem; line-height: 1.3; }
.roster thead th b { display: block; color: var(--ink); font-size: .85rem; }
.roster tfoot td { color: var(--ink-soft); font-size: .78rem; border-bottom: 0; }
.roster tr.mine td { background: var(--surface-2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--ink-soft); margin: 0; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 6px; }
.card.important { border-left: 4px solid var(--accent-bright); }
.card h3 { margin: 0; font-size: 1rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card p { margin: 0; color: var(--ink-soft); white-space: pre-wrap; overflow-wrap: anywhere; }
.card time { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.badge { font-size: .68rem; background: var(--accent); color: #fff; padding: 0 8px; border-radius: 99px; }
.prose p { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.prose h3 { font-family: var(--serif); margin: 8px 0 8px; font-size: 1.1rem; color: var(--gold); }
dl.facts { display: grid; grid-template-columns: max-content minmax(0,1fr); margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.facts dt, .facts dd { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.facts dt { font-weight: 700; background: var(--bg-alt); }
.facts dd { overflow-wrap: anywhere; }
.facts > :nth-last-child(-n+2) { border-bottom: 0; }

/* editor sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg-alt); border: 1px solid var(--line); border-radius: 14px 14px 0 0; width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 14px; } }
.sheet h2 { margin: 0; font-size: 1.1rem; }
.field { display: grid; gap: 4px; }
.field label { font-size: .82rem; color: var(--ink-soft); }
.field .hint { font-size: .76rem; color: var(--ink-soft); }
.check { display: flex; gap: 8px; align-items: center; }
.sheet .actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--surface-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 99px; z-index: 60; font-size: .88rem; max-width: calc(100% - 32px); }
footer { border-top: 3px solid var(--accent); background: #070505; color: var(--ink-soft); font-size: .8rem; }
footer .wrap { padding-block: 18px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

    state.db.collection(path).onSnapshot(function (snap) {
      onDocs(snap.docs.filter(function (d) { return d.exists; }));
      if (key && !snap.metadata.fromCache) { state.loaded[key] = true; }
      if (key) state.loaded[key] = true;
      if (key === "events" && !snap.metadata.fromCache) { clearTimeout(loadTimer); banner(""); }
      renderAll();
    }, function () { clearTimeout(loadTimer); banner("データを読み込めませんでした。ページを開き直してください。", true); });
  }
  function rows(docs) { return docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }

  (async function () {
    if (!window.claude || !window.claude.use) { clearTimeout(loadTimer); banner("このページは claude.ai 上で開いてください。", true); return; }
    var [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) { clearTimeout(loadTimer); banner("このページを見るには、招待されたアカウントでログインしてください。", true); state.loaded.events = state.loaded.members = true; renderAll(); return; }
    state.db = db; state.user = user;
    if (user) {
      try {
        var r = await Promise.all([user.id(), user.canEdit(), user.isOwner(), user.can("data.write")]);
        state.uid = r[0]; state.canEdit = !!r[1]; state.isOwner = !!r[2]; state.canWrite = r[3];
        if (!state.uid) banner("閲覧のみのアカウントです。出欠を入力するには、管理者に招待してもらってください。");
        else if (state.canWrite === false) banner("閲覧のみの権限です。出欠を入力するには、管理者に権限を変更してもらってください。");
        if (state.uid && !myName()) { var nm = await user.name(); if (nm && !$("reg-name").value) $("reg-name").value = nm; }
      } catch (e) {}
    }
    listen("events", function (d) { state.events = rows(d); }, "events");
    listen("members", function (d) { state.members = {}; d.forEach(function (x) { state.members[x.id] = x.data(); }); }, "members");
    listen("news", function (d) { state.news = rows(d); });
    listen("notices", function (d) { state.notices = rows(d); });
    db.doc("info/about").onSnapshot(function (s) { state.about = s.exists ? s.data() : {}; renderAbout(); }, function () {});
  })();
})();
</script>
