<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;font-family:"M PLUS Rounded 1c","IPAGothic",sans-serif;color:#3D2E22;background:#FFF8EE;overflow:hidden;position:relative}
.plank{position:absolute;left:0;right:0;height:56px;background:repeating-linear-gradient(90deg,#D49A5C 0 3px,#C98A4B 3px 110px,#CF9455 110px 113px,#C78748 113px 240px)}
.plank.t{top:0}.plank.b{bottom:0}
.in{position:absolute;top:96px;left:72px;right:72px}
.tag{display:inline-block;background:#E8742E;color:#fff;font-weight:800;font-size:26px;padding:8px 26px;border-radius:40px;letter-spacing:.05em}
h1{font-size:96px;font-weight:800;line-height:1.15;margin-top:16px;letter-spacing:.02em}
h1 span{color:#4E8A3E}
.lead{font-size:32px;font-weight:800;color:#8E5A2B;margin-top:10px}
.lead em{font-style:normal;background:linear-gradient(transparent 60%,#FFD98A 60%)}
.fig{margin-top:26px;background:#fff;border:5px solid #3D2E22;border-radius:32px;padding:14px 20px 8px;position:relative}
.fig .cap{position:absolute;top:-22px;left:30px;background:#3D2E22;color:#fff;font-size:23px;font-weight:800;padding:4px 20px;border-radius:30px}
svg text{font-family:"M PLUS Rounded 1c","IPAGothic",sans-serif;font-weight:800}
.merits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.mc{background:#fff;border:3px solid #E7D6C2;border-radius:22px;padding:16px 14px;text-align:center}
.mc .n{display:inline-flex;width:44px;height:44px;border-radius:50%;background:#4E8A3E;color:#fff;font-size:24px;font-weight:800;align-items:center;justify-content:center}
.mc b{display:block;font-size:26px;font-weight:800;line-height:1.3;margin-top:8px}
.mc small{display:block;font-size:19px;font-weight:700;color:#7A6352;margin-top:6px;line-height:1.4}
.pt{margin-top:20px;background:#3D2E22;color:#fff;border-radius:24px;padding:16px 26px;display:flex;gap:22px;align-items:center}
.pt .l{flex:none;background:#FFC86B;color:#3D2E22;font-weight:800;font-size:22px;padding:6px 14px;border-radius:12px}
.pt p{font-size:24px;font-weight:700;line-height:1.55}
.pt p b{color:#FFC86B;font-weight:800}
</style></head><body>
<div class="plank t"></div>
<div class="in">
  <div class="tag">特典｜ウッドデッキの骨組み</div>
  <h1><span>サンドイッチ</span>工法</h1>
  <p class="lead">支柱を、根太で両側から<em>「はさんで」</em>留める組み方</p>

  <div class="fig">
    <div class="cap">根太の向きから見た断面</div>
    <svg viewBox="0 0 900 470" width="100%">
      <defs>
        <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 7 Q7 3 14 7" stroke="#B9783D" stroke-width="1.2" fill="none" opacity=".35"/></pattern>
      </defs>
      <!-- ground -->
      <rect x="0" y="420" width="900" height="50" fill="#EADBC6"/>
      <path d="M0 420 H900" stroke="#B8A389" stroke-width="3"/>
      <!-- 束石 -->
      <path d="M375 380 H525 L545 440 H355 Z" fill="#B9B4AC" stroke="#3D2E22" stroke-width="4" stroke-linejoin="round"/>
      <!-- 支柱 (具) -->
      <rect x="405" y="132" width="90" height="248" fill="#E8742E" stroke="#3D2E22" stroke-width="4"/>
      <rect x="405" y="132" width="90" height="248" fill="url(#grain)"/>
      <!-- 根太 left/right (パン) -->
      <rect x="363" y="120" width="42" height="150" rx="3" fill="#E9A44C" stroke="#3D2E22" stroke-width="4"/>
      <rect x="495" y="120" width="42" height="150" rx="3" fill="#E9A44C" stroke="#3D2E22" stroke-width="4"/>
      <!-- 床板 -->
      <g fill="#D9B07A" stroke="#3D2E22" stroke-width="4">
        <rect x="150" y="92" width="140" height="28" rx="3"/>
        <rect x="298" y="92" width="140" height="28" rx="3"/>
        <rect x="446" y="92" width="140" height="28" rx="3"/>
        <rect x="594" y="92" width="140" height="28" rx="3"/>
      </g>
      <!-- screws -->
      <g stroke="#3D2E22" stroke-width="5" stroke-linecap="round">
        <line x1="330" y1="168" x2="440" y2="168"/><line x1="330" y1="222" x2="440" y2="222"/>
        <line x1="570" y1="168" x2="460" y2="168"/><line x1="570" y1="222" x2="460" y2="222"/>
      </g>
      <g fill="#3D2E22">
        <rect x="322" y="160" width="10" height="16" rx="2"/><rect x="322" y="214" width="10" height="16" rx="2"/>
        <rect x="568" y="160" width="10" height="16" rx="2"/><rect x="568" y="214" width="10" height="16" rx="2"/>
      </g>
      <!-- labels -->
      <g font-size="26" fill="#3D2E22">
        <text x="760" y="114">床板</text>
        <path d="M740 106 H736" stroke="#3D2E22" stroke-width="3"/>
        <!-- 根太 left -->
        <path d="M363 250 L250 300" stroke="#3D2E22" stroke-width="3" fill="none"/>
        <text x="96" y="312">根太</text>
        <text x="96" y="344" font-size="20" fill="#8E5A2B">＝パン</text>
        <!-- 根太 right -->
        <path d="M537 250 L660 300" stroke="#3D2E22" stroke-width="3" fill="none"/>
        <text x="668" y="312">根太</text>
        <text x="668" y="344" font-size="20" fill="#8E5A2B">＝パン</text>
        <!-- 支柱 -->
        <path d="M450 330 L450 330" />
        <text x="450" y="318" text-anchor="middle" fill="#fff" font-size="26">支柱</text>
        <text x="450" y="350" text-anchor="middle" fill="#fff" font-size="20">＝具</text>
        <!-- 束石 -->
        <path d="M545 415 L640 395" stroke="#3D2E22" stroke-width="3"/>
        <text x="648" y="402">束石</text>
        <!-- ビス -->
        <path d="M322 168 L210 160" stroke="#3D2E22" stroke-width="3"/>
        <text x="96" y="170">ビス</text>
      </g>
    </svg>
  </div>

  <div class="merits">
    <div class="mc"><span class="n">1</span><b>大引が<br>いらない</b><small>部材が少なく、<br>材料費も重さも減る</small></div>
    <div class="mc"><span class="n">2</span><b>切り欠き<br>加工なし</b><small>支柱を削らず、<br>はさんで留めるだけ</small></div>
    <div class="mc"><span class="n">3</span><b>高さを<br>合わせやすい</b><small>根太の位置をずらして<br>水平を微調整できる</small></div>
  </div>

  <div class="pt"><span class="l">コツ</span><p>全体の水平は<b>外周の根太</b>で決まる。<br>ビスは<b>1か所3〜4本</b>、両側の根太から打つ。</p></div>
</div>
<div class="plank b"></div>
</body></html>
