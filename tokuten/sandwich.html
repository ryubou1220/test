<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#FFF8EC;font-family:"M PLUS Rounded 1c","IPAGothic",sans-serif;color:#4A3426;overflow:hidden;position:relative}
.dots{position:absolute;inset:0;background-image:radial-gradient(#F3DFC0 2px,transparent 2px);background-size:28px 28px;opacity:.7}
.wrap{position:relative;padding:64px 70px}
.tag{display:inline-block;background:#E8553D;color:#fff;font-weight:800;font-size:26px;padding:8px 26px;border-radius:40px;letter-spacing:.1em}
h1{font-size:104px;font-weight:800;letter-spacing:.04em;margin-top:18px;line-height:1.1}
h1 span{color:#E8553D}
.lead{font-size:32px;font-weight:700;margin-top:14px;color:#7A5A44}
.stack{margin-top:46px;display:flex;flex-direction:column;gap:0;align-items:stretch}
.layer{position:relative;display:flex;align-items:center;gap:28px;padding:0 50px}
.num{flex:none;width:84px;height:84px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.txt b{display:block;font-size:46px;font-weight:800;line-height:1.2}
.txt small{display:block;font-size:27px;font-weight:700;margin-top:6px;opacity:.9}
.bun-top{background:#E9A44C;color:#fff;height:210px;border-radius:200px 200px 34px 34px;box-shadow:inset 0 -14px 0 #D18A32}
.bun-top .num{color:#D18A32}
.seeds{position:absolute;top:34px;left:0;right:0;height:30px}
.seeds i{position:absolute;width:16px;height:8px;background:#FFF1D6;border-radius:8px}
.lettuce{height:34px;background:#7DBB4C;margin:-6px 22px 0;border-radius:0 0 30px 30px;clip-path:polygon(0 0,100% 0,100% 40%,96% 100%,91% 45%,86% 100%,81% 45%,76% 100%,71% 45%,66% 100%,61% 45%,56% 100%,51% 45%,46% 100%,41% 45%,36% 100%,31% 45%,26% 100%,21% 45%,16% 100%,11% 45%,6% 100%,2% 45%,0 40%)}
.filling{background:#E8553D;color:#fff;height:200px;margin:-4px 10px 0;border-radius:26px;box-shadow:inset 0 -12px 0 #C9402B}
.filling .num{color:#C9402B}
.cheese{height:30px;background:#FFCF3F;margin:-4px 0 0;clip-path:polygon(0 0,100% 0,100% 30%,90% 100%,80% 30%,62% 30%,52% 100%,42% 30%,20% 30%,10% 100%,0 30%)}
.bun-bottom{background:#E9A44C;color:#fff;height:190px;margin-top:-6px;border-radius:30px 30px 90px 90px;box-shadow:inset 0 -14px 0 #D18A32}
.bun-bottom .num{color:#D18A32}
.ex{margin-top:46px;background:#fff;border:4px solid #4A3426;border-radius:32px;padding:30px 40px;position:relative}
.ex h2{position:absolute;top:-26px;left:36px;background:#4A3426;color:#fff;font-size:26px;padding:6px 22px;border-radius:30px}
.ex p{font-size:29px;font-weight:700;line-height:1.65;margin-top:6px}
.ex p em{font-style:normal;padding:0 6px;border-radius:6px}
.y{background:#FCE3B8}.r{background:#FAD3CC}
.point{margin-top:30px;display:flex;align-items:center;gap:18px;font-size:30px;font-weight:800;color:#E8553D;justify-content:center}
</style></head><body><div class="dots"></div>
<div class="wrap">
  <div class="tag">特典｜伝え方テクニック</div>
  <h1><span>サンドイッチ</span>工法</h1>
  <p class="lead">言いにくいことは「ほめ言葉」ではさんで伝える</p>

  <div class="stack">
    <div class="layer bun-top">
      <div class="seeds"><i style="left:22%;top:4px;transform:rotate(-20deg)"></i><i style="left:38%;top:-6px;transform:rotate(15deg)"></i><i style="left:54%;top:2px;transform:rotate(-10deg)"></i><i style="left:70%;top:-4px;transform:rotate(25deg)"></i><i style="left:82%;top:12px;transform:rotate(-15deg)"></i></div>
      <div class="num">1</div>
      <div class="txt"><b>まず、ほめる</b><small>良い点・努力を具体的に認める</small></div>
    </div>
    <div class="lettuce"></div>
    <div class="layer filling">
      <div class="num">2</div>
      <div class="txt"><b>本題を伝える</b><small>改善点・お願いを「提案」として</small></div>
    </div>
    <div class="cheese"></div>
    <div class="layer bun-bottom">
      <div class="num">3</div>
      <div class="txt"><b>期待でしめる</b><small>信頼と前向きな一言で締めくくる</small></div>
    </div>
  </div>

  <div class="ex">
    <h2>使い方の例</h2>
    <p><em class="y">①資料、とても見やすくまとまってるね！</em><br>
    <em class="r">②数字の根拠を1枚足すと、さらに説得力が出そう。</em><br>
    <em class="y">③この調子なら次の提案もきっと通るよ。</em></p>
  </div>
  <div class="point">★ ほめ言葉は「具体的に」がコツ ★</div>
</div>
</body></html>
